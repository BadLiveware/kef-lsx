[package]
name = "kef-lsx"
version = "0.1.0"
edition = "2021"
description = "Unofficial control library + CLI for first-generation KEF LSX / LS50 Wireless speakers"
license = "MIT OR Apache-2.0"

[lib]
name = "kef_lsx"
path = "src/lib.rs"

[[bin]]
name = "keflsx"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
